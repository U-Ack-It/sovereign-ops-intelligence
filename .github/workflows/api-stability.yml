name: API Stability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-stability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-stability:
    name: API Stability Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        env:
          SOVEREIGN_ADMIN_API_KEY: ci-release-verification-admin-key-12345
        run: npm run verify:release

      - name: Upload Bug Sentinel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-sentinel-report
          path: apps/api/.artifacts/bug-sentinel/
